# fly.toml — Fly.io config for Dead Giveaway
# See https://fly.io/docs/reference/configuration/

app = "dead-giveaway-game"
primary_region = "iad"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "dead-giveaway-game.fly.dev"
  PORT = "8080"
  ECTO_IPV6 = "true"
  DNS_CLUSTER_QUERY = "dead-giveaway-game.internal"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Single machine only. Rooms live in per-node GenServers and the app is not
  # clustered (no distributed registry / distribution isn't even enabled), so a
  # second machine means split-brain games: two players on different machines get
  # separate worlds for the same room code (#72). Keep exactly one machine always
  # up so in-memory room state survives and there's nothing to split across. Do
  # NOT scale count > 1 without a distributed process registry.
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
